  <script>
    // 점들에 해당하는 화면 크기 (너비, 높이)와 표시할 텍스트를 설정합니다.
    // 사용자가 창 크기를 조절하여 우측 하단 모서리를 점에 맞출 때 뜨는 화면의 너비/높이를 여기에 입력하세요.
    // 현재 표시기가 실시간으로 1024x768 등의 창 사이즈를 보여주므로, 직접 모서리를 점에 맞춘 후 그 숫자를 적으시면 됩니다!
    const targetPoints = [
      { text: "2014.11.01", x: 667, y: 263 },      // 예시키
      { text: "2014.11.22", x: 787, y: 326 },
      { text: "2 weeks", x: 864, y: 471 },
      { text: "3 month", x: 1054, y: 403 },        // 예시키
      { text: "8 years", x: 1235, y: 552 },        // 예시키
      { text: "1 years", x: 1150, y: 450 },
      { text: "2016.11.22", x: 1061, y: 276 },
      { text: "5 years", x: 1260, y: 268 },
      { text: "step.07", x: 1211, y: 376 },       // 예시키
      { text: "10 year olds", x: 672, y: 630 },    // 예시키
      { text: "2023.08.17", x: 1027, y: 623 },      // 예시키
      { text: "2026.04.04", x: 582, y: 488 }       // 예시키
    ];

    const PROXIMITY_THRESHOLD = 30; // 점 근처 30px 이내로 창 모서리가 들어오면 인식

    function updateWindowSize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      let displayText = `${width}x${height}`; // 기본 표시 텍스트

      // 각 타겟 점들과 현재 창 우측 하단(width, height) 사이의 거리 계산
      for (let i = 0; i < targetPoints.length; i++) {
        const point = targetPoints[i];

        // 피타고라스의 정리로 거리 계산
        const dx = width - point.x;
        const dy = height - point.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance <= PROXIMITY_THRESHOLD) {
          displayText = point.text;
          break; // 가장 처음으로 근접한 점의 텍스트를 표시
        }
      }

      document.getElementById('window-size-text').innerText = displayText;

      // Handle audio playback based on current screen
      checkAudioState();
    }

    const audio = document.getElementById('bg-music');
    const heartbeatAudio = document.getElementById('heartbeat-music');
    const littleCatAudio = document.getElementById('little-cat-music');
    const sweetKittyAudio = document.getElementById('sweet-kitty-music');
    const catPainAudio = document.getElementById('cat-pain-music');
    const cartoonBeggingAudio = document.getElementById('cartoon-begging-music');
    const hungryAudio = document.getElementById('hungry-music');
    const angryCartoonAudio = document.getElementById('angry-cartoon-music');
    const angryWildAudio = document.getElementById('angry-wild-music');
    const purrAudio = document.getElementById('purr-music');
    const rareguyAudio = document.getElementById('rareguy-music');
    const happyCatAudio = document.getElementById('happy-cat-music');
    const eatingCatAudio = document.getElementById('eating-cat-music');
    const soundToggle = document.getElementById('sound-toggle');
    const desktopView = document.getElementById('desktop-view');
    let isSoundIntendedToPlay = false; // User's preference for sound

    // Toggle sound when clicking the icon
    soundToggle.addEventListener('click', () => {
      isSoundIntendedToPlay = !isSoundIntendedToPlay;

      if (isSoundIntendedToPlay) {
        soundToggle.classList.remove('sound-off');
        soundToggle.classList.add('sound-on');
      } else {
        soundToggle.classList.remove('sound-on');
        soundToggle.classList.add('sound-off');
      }

      checkAudioState();
    });

    // Function to handle play/pause for a specific audio element
    function toggleAudioPlayback(audioEl, shouldPlay, isOneShot = false) {
      if (!audioEl) return;
      if (shouldPlay && isSoundIntendedToPlay) {
        if (audioEl.paused && (!isOneShot || !audioEl.ended)) {
          audioEl.play().catch(e => console.log("Audio playback was prevented."));
        }
      } else {
        if (!audioEl.paused) {
          audioEl.pause();
        }
        if (isOneShot) {
          audioEl.currentTime = 0; // reset so it can play again when returning to the screen
        }
      }
    }

    // Check if we are on the main screen and play/pause audio accordingly
    function checkAudioState() {
      const mobileView = document.getElementById('mobile-view');
      const view1d = document.getElementById('view-725-313'); // 1d_ png screen
      const view2w = document.getElementById('view-830-435'); // 2w png screen
      const view1y = document.getElementById('view-1150-450'); // 1y png screen
      const view3 = document.getElementById('view-1026-391'); // 3 png screen
      const view8 = document.getElementById('view-1235-552'); // 8 png screen
      const view2y = document.getElementById('view-1061-276'); // 2y png screen
      const view5y = document.getElementById('view-1221-238'); // 5y png screen
      const view6 = document.getElementById('view-1178-361'); // 6 png screen
      const view9 = document.getElementById('view-1027-623'); // 9 png screen
      const view10 = document.getElementById('view-617-623'); // 10 png screen
      const view11 = document.getElementById('view-574-423'); // 11 png screen

      const isMainScreen = window.getComputedStyle(desktopView).display !== 'none';
      const isMobileScreen = mobileView && window.getComputedStyle(mobileView).display !== 'none';
      const is1dScreen = view1d && window.getComputedStyle(view1d).display !== 'none';
      const is2wScreen = view2w && window.getComputedStyle(view2w).display !== 'none';
      const is1yScreen = view1y && window.getComputedStyle(view1y).display !== 'none';
      const is3Screen = view3 && window.getComputedStyle(view3).display !== 'none';
      const is8Screen = view8 && window.getComputedStyle(view8).display !== 'none';
      const is2yScreen = view2y && window.getComputedStyle(view2y).display !== 'none';
      const is5yScreen = view5y && window.getComputedStyle(view5y).display !== 'none';
      const is6Screen = view6 && window.getComputedStyle(view6).display !== 'none';
      const is9Screen = view9 && window.getComputedStyle(view9).display !== 'none';
      const is10Screen = view10 && window.getComputedStyle(view10).display !== 'none';
      const is11Screen = view11 && window.getComputedStyle(view11).display !== 'none';

      toggleAudioPlayback(audio, isMainScreen, false);
      toggleAudioPlayback(heartbeatAudio, isMobileScreen, false);
      toggleAudioPlayback(littleCatAudio, is1dScreen, true);
      toggleAudioPlayback(sweetKittyAudio, is2wScreen, true);
      toggleAudioPlayback(catPainAudio, is1yScreen, true);
      toggleAudioPlayback(cartoonBeggingAudio, is3Screen, true);
      toggleAudioPlayback(hungryAudio, is8Screen, true);
      toggleAudioPlayback(angryCartoonAudio, is2yScreen, true);
      toggleAudioPlayback(angryWildAudio, is5yScreen, true);
      toggleAudioPlayback(purrAudio, is6Screen, true);
      toggleAudioPlayback(rareguyAudio, is9Screen, true);
      toggleAudioPlayback(happyCatAudio, is10Screen, true);
      toggleAudioPlayback(eatingCatAudio, is11Screen, true);
    }

    window.addEventListener('resize', updateWindowSize);
    window.addEventListener('DOMContentLoaded', updateWindowSize);
  </script>
